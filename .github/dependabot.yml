version: 2
updates:
  # Root package (contracts/tests)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Batch all non-major bumps into a single PR to keep the queue quiet.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Block ALL major version upgrades — require manual migration
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Frontend (web/)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Batch all non-major bumps into a single PR to keep the queue quiet.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Block ALL major version upgrades — require manual migration
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: workflows pin actions to commit SHAs, so Dependabot is what
  # moves them forward (it updates the SHA and the version comment together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
