name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Every Monday 9am UTC

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No continue-on-error: this step must be able to fail. It used to be set,
      # which made the job pass unconditionally -- PR #61's run printed several
      # "Severity: high" findings and the job still concluded success. A check that
      # can't go red isn't evidence of anything. Dependency Audit is not a required
      # status check, so a red run here never blocks a merge; it is a signal.
      #
      # Known accepted finding as of 2026-10-03: GHSA-vfj7-8cjw-p6xm (braces,
      # stack-exhaustion DoS via deeply nested patterns), pulled in transitively via
      # @clarigen/cli -> chokidar -> braces. @clarigen/cli is a devDependency (the
      # Clarity-to-TypeScript codegen tool, `npm run gen`) -- never shipped, never
      # reachable by anyone outside this repo's own `contracts/` tree, which is the
      # only glob chokidar ever watches here. No upstream fix exists yet: braces'
      # latest release (3.0.3) is still inside the advisory's vulnerable range, and
      # `npm audit fix --force`'s only suggested remediation is downgrading
      # @clarigen/cli to 0.2.4 -- a multi-major-version regression of an actively
      # used dev tool to dodge a DoS risk this project's own usage can't trigger.
      # Accepted deliberately, not silently: re-check `npm audit --audit-level=high`
      # next time this step goes red, since a real upstream patch (or a new,
      # unrelated finding worth acting on) would change this call.
      - name: Audit root dependencies
        run: npm audit --audit-level=high

      # if: always() -- the step above can fail (by design, see its own comment),
      # and a failed step otherwise skips every step after it in the same job.
      # Without this, web/'s audit never ran while root stayed red, so web/'s own
      # findings went unsurfaced in CI (26 vulnerabilities, including moderates
      # with a real fix available -- see DEP-1/DEP-2). Found 2026-10-05.
      - name: Audit web dependencies
        if: always()
        run: cd web && npm audit --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
