# --- flashstack-pool-v3: generic multi-asset flash-loan + LP pool ---
# Migrated to Clarity 6 on 2026-09-09 (see the file's own header comment for
# the as-contract -> as-contract?/current-contract migration detail). Earlier
# notes here called the clarity_version=6 "use of unresolved function
# 'as-contract'" error a toolchain gap -- that was wrong. `as-contract` is a
# hard error by design as of Clarity 4, deprecated in favor of `as-contract?`
# (explicit outflow allowances) and `current-contract`. The receiver test
# contracts below (test-pool-v3-receiver-*) deliberately stay on Clarity 3 --
# each contract's version is fixed independently at deploy time, and
# cross-version contract-call? is normal on Stacks, so there's no reason to
# touch contracts this migration didn't require changing.
[contracts.sip-010-trait-ft-standard]
path = "contracts/test/sip-010-trait-ft-standard.clar"
clarity_version = 3
epoch = "3.0"

[contracts.flashstack-v3-receiver-trait]
